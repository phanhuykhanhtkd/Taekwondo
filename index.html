<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!-- KP Taekwondo – trang ngoài mở web app Google Apps Script trong khung toàn màn hình,
     để không còn dòng chữ "Ứng dụng này do một người dùng Google Apps Script tạo".
     CHỈ CẦN SỬA 1 DÒNG: dán link web app (dạng https://script.google.com/macros/s/…/exec) vào APP_URL bên dưới. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taekwondo">
<meta name="application-name" content="CLB VÕ THUẬT TAEKWONDO">
<meta name="theme-color" content="#7d0a0e">
<title>CLB VÕ THUẬT TAEKWONDO</title>
<link id="icon" rel="icon" href="data:,">
<link id="touch" rel="apple-touch-icon" href="data:,">
<style>
  :root { --bar: #7d0a0e; --foot: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --foot: #1d1517; } }
  html, body { margin: 0; height: 100%; background: var(--bar); overflow: hidden; }
  body { display: flex; flex-direction: column; height: 100dvh;
    padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box;
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  #app { flex: 1; width: 100%; border: 0; display: block; background: var(--foot); }
  #foot { height: env(safe-area-inset-bottom, 0px); background: var(--foot); flex: none; }
  #wait { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 35%, #8e0b10, #3a0507);
    color: #f0cd7f; text-align: center; transition: opacity .35s; z-index: 2; }
  #wait.off { opacity: 0; pointer-events: none; }
  #wait img { width: 92px; height: 92px; border-radius: 50%; object-fit: contain; display: block; margin: 0 auto 14px; }
  #wait b { display: block; font-size: 20px; letter-spacing: .12em; color: #fff; }
  #wait small { display: block; margin-top: 6px; font-size: 12px; letter-spacing: .2em; }
  #wait .ring { width: 30px; height: 30px; margin: 18px auto 0; border: 3px solid rgba(240,205,127,.3); border-top-color: #f0cd7f; border-radius: 50%; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  #err { display: none; max-width: 300px; margin: 16px auto 0; font-size: 14px; line-height: 1.5; color: #fff; }
</style>
</head>
<body>
<div id="wait"><div><img id="wlogo" alt="" hidden><b>CLB VÕ THUẬT TAEKWONDO</b><small>ĐAM MÊ &amp; KỶ LUẬT</small><div class="ring"></div><div id="err"></div></div></div>
<iframe id="app" title="CLB VÕ THUẬT TAEKWONDO" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
<div id="foot"></div>
<script>
  /* ====== DÁN LINK WEB APP VÀO ĐÂY (giữ nguyên dấu nháy) ====== */
  var APP_URL = 'https://script.google.com/macros/s/AKfycbznMUtwucns3XhMAsjmZA__QfEyspcCEcSObDsKjeLlCIU0Rny49dMDHoGvB1xuw-J1/exec';
  /* ============================================================= */

  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }
  };
  var q = new URLSearchParams(location.search);
  /* Chìa khóa thiết bị: lấy từ link (biểu tượng màn hình chính) hoặc bộ nhớ của trang này */
  var key = q.get('k') || store.get('kp_k') || '';
  var standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;

  function setIcon(src) {
    if (!src) return;
    document.getElementById('touch').href = src;
    document.getElementById('icon').href = src;
    var w = document.getElementById('wlogo'); w.src = src; w.hidden = false;
  }
  setIcon(store.get('kp_logo'));

  function keepKey(k) {
    key = k || '';
    store.set('kp_k', key);
    /* Ghi chìa khóa lên thanh địa chỉ: khi "Thêm vào MH chính", biểu tượng mở thẳng vào app, không hỏi lại mật khẩu */
    var u = new URL(location.href);
    if (key) u.searchParams.set('k', key); else u.searchParams.delete('k');
    try { history.replaceState(null, '', u.pathname + u.search + u.hash); } catch (e) {}
  }

  window.addEventListener('message', function (e) {
    var o = String(e.origin || '');
    if (!/^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/.test(o) && o !== 'https://script.google.com') return;
    var d = e.data || {};
    if (!d.kp) return;
    if (d.type === 'key') keepKey(d.key);
    if (d.type === 'brand' && /^data:image\//.test(d.logo || '') && d.logo.length < 300000) { store.set('kp_logo', d.logo); setIcon(d.logo); }
  });

  var frame = document.getElementById('app');
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(APP_URL)) {
    var er = document.getElementById('err');
    er.style.display = 'block';
    er.textContent = 'Chưa dán link web app. Mở file index.html, dán link dạng https://script.google.com/macros/s/…/exec vào dòng APP_URL.';
    document.querySelector('#wait .ring').style.display = 'none';
  } else {
    frame.src = APP_URL + '?w=1&sa=' + (standalone ? 1 : 0) + (key ? '&k=' + encodeURIComponent(key) : '');
    frame.addEventListener('load', function () { setTimeout(function () { document.getElementById('wait').classList.add('off'); }, 250); });
  }
</script>
</body>
</html>
